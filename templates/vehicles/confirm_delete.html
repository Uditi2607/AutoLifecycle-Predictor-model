{% extends "base.html" %}
{% block title %}Delete {{ vehicle }} — AutoLifecycle Predictor{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="alp-card text-center" style="border-color: rgba(239,68,68,0.3);">
                <div class="text-danger fs-1 mb-3"><i class="bi bi-exclamation-triangle-fill"></i></div>
                <h4 class="mb-2">Delete Vehicle?</h4>
                <p class="text-muted mb-4">
                    You are about to permanently delete <strong class="text-white">{{ vehicle.display_name }}</strong>.
                    This action cannot be undone.
                </p>
                <div class="d-flex gap-3 justify-content-center">
                    <a href="{% url 'vehicles:vehicle_detail' vehicle.pk %}" class="btn btn-surface">Cancel</a>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn" style="background: var(--alp-red); color: white;">
                            <i class="bi bi-trash me-1"></i>Yes, Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
